<form id="orderForm" onsubmit="processCheckout(event)">
    
    <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="name" name="Customer_Name" required minlength="3" placeholder="Ali Khan">
    </div>

    <div class="input-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" name="Phone_Number" required pattern="^03[0-9]{9}$" placeholder="03XXXXXXXXX">
    </div>

    <div class="input-group">
        <label>Street Address</label>
        <input type="text" id="address" name="Address" required minlength="10" placeholder="House 123, Street 4...">
    </div>

    <div class="form-row">
        <div class="input-group">
            <label>Province</label>
            <select id="province" name="Province" required>
                <option value="" disabled selected>Select Province</option>
                <option value="Sindh">Sindh</option>
                <option value="Punjab">Punjab</option>
                <option value="Balochistan">Balochistan</option>
                <option value="KPK">Khyber Pakhtunkhwa</option>
                <option value="GB">Gilgit-Baltistan</option>
                <option value="AJK">AJK</option>
            </select>
        </div>
        <div class="input-group">
            <label>City</label>
            <input type="text" id="city" name="City" required placeholder="Karachi">
        </div>
    </div>

    <h2>Payment Method</h2>
    <div class="payment-method">
        <input type="radio" id="cod" name="Payment_Method" value="Cash on Delivery" checked required>
        <label for="cod">Cash on Delivery (COD)</label>
    </div>

    <button type="submit" id="submit-btn" class="checkout-btn">Place Order</button>
</form>
