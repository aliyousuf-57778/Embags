<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | AURA</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo" style="text-decoration:none;">AURA</a>
        <nav>
            <a href="index.html">Back to Shop</a>
        </nav>
    </header>

    <main class="checkout-container">
        <div class="checkout-grid">
            <!-- Cart Summary -->
            <div class="cart-summary">
                <h2>Order Summary</h2>
                <div id="cart-items"></div>
                <div class="total-row">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>
                <div class="total-row grand-total">
                    <span>Total</span>
                    <span id="cart-total">Rs. 0</span>
                </div>
            </div>

            <!-- Checkout Form -->
            <div class="checkout-form">
                <h2>Shipping Details</h2>
                <form id="orderForm" onsubmit="processCheckout(event)">
                    
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="name" required minlength="3" placeholder="Ali Khan">
                    </div>

                    <div class="input-group">
                        <label>Phone Number</label>
                        <!-- Pattern ensures standard 11 digit Pakistani number format starting with 03 -->
                        <input type="tel" id="phone" required pattern="^03[0-9]{9}$" placeholder="03XXXXXXXXX" title="Must be a valid 11-digit Pakistani number starting with 03">
                    </div>

                    <div class="input-group">
                        <label>Street Address</label>
                        <input type="text" id="address" required minlength="10" placeholder="House 123, Street 4...">
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label>Province</label>
                            <select id="province" required>
                                <option value="" disabled selected>Select Province</option>
                                <option value="Sindh">Sindh</option>
                                <option value="Punjab">Punjab</option>
                                <option value="Balochistan">Balochistan</option>
                                <option value="KPK">Khyber Pakhtunkhwa</option>
                                <option value="GB">Gilgit-Baltistan</option>
                                <option value="AJK">AJK</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>City</label>
                            <input type="text" id="city" required placeholder="Karachi">
                        </div>
                    </div>

                    <h2>Payment Method</h2>
                    <div class="payment-method">
                        <input type="radio" id="cod" name="payment" value="cod" checked required>
                        <label for="cod">Cash on Delivery (COD)</label>
                    </div>

                    <button type="submit" class="checkout-btn">Place Order</button>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        // Render cart immediately on checkout page load
        document.addEventListener('DOMContentLoaded', renderCheckoutCart);
    </script>
</body>
</html>
